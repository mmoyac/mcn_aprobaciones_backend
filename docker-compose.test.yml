# MySQL de pruebas de integración (tests/integration).
# Replica la versión y el sql_mode de los servidores de los clientes (5.6.51,
# NO_ENGINE_SUBSTITUTION) con tres esquemas:
#   t_numerico     -> estructura de gontec (pre_nro BIGINT)
#   t_alfanumerico -> estructura de mcn    (pre_nro CHAR(12))
#   t_reppdf       -> estructura de lexascl_reppdf (pdf001)
#
#   docker compose -f docker-compose.test.yml up -d
#   pytest -m integration
services:
  mysql-test:
    image: mysql:5.6.51
    container_name: mcn_aprobaciones_mysql_test
    command: ["--sql-mode=NO_ENGINE_SUBSTITUTION", "--character-set-server=utf8"]
    environment:
      MYSQL_ROOT_PASSWORD: test
    ports:
      - "3356:3306"
    volumes:
      - ./tests/integration/sql:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ptest"]
      interval: 3s
      timeout: 3s
      retries: 40
